name: Deploy Mobile Web & Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'mobile-web/**'
      - 'cf-backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile-web/package-lock.json'

      - name: Install Dependencies & Build Mobile Web
        run: |
          cd mobile-web
          npm install
          npm run build

      - name: Deploy to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          cd cf-backend
          if [ -n "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            sed -i "s/YOUR_D1_DATABASE_ID/$CLOUDFLARE_D1_DATABASE_ID/g" wrangler.jsonc
          fi
          npm install
          npx wrangler deploy
